# Debian 13 (Trixie) — network + mirror only (interactive installer)
# ==================================================================
# Loaded from the initrd so netcfg/choose-mirror do not use DHCP or
# IPv6. All other installer questions stay interactive.
#
# Do not add auto=true / priority=critical here.

### Network — DHCP autoconfiguration
d-i netcfg/choose_interface                     select  auto
d-i netcfg/link_wait_timeout                    string  10
d-i netcfg/get_hostname                         string  debian
d-i netcfg/get_domain                           string  local
d-i netcfg/wireless_wep                         string
d-i hw-detect/load_firmware                     boolean false

# choose-mirror wget reads this; DHCP would otherwise leave it empty.
d-i preseed/early_command string echo "nameserver 1.1.1.1" > /etc/resolv.conf; echo "nameserver 8.8.8.8" >> /etc/resolv.conf

### Mirror — HTTP only. HTTPS needs GNU wget; busybox wget cannot speak TLS.
d-i mirror/protocol                             string  http
d-i mirror/country                              string  manual
d-i mirror/http/hostname                        string  deb.debian.org
d-i mirror/http/directory                       string  /debian
d-i mirror/http/proxy                           string
d-i mirror/suite                                string  trixie
d-i mirror/codename                             string  trixie

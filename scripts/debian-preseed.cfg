# Debian 13 (Trixie) Netboot Unattended Preseed
# ================================================
# Fully automated installation for vmm on Apple Silicon.
# Target: single VirtIO disk /dev/vda, minimal system, root login.
#
# Boot with: auto=true priority=critical (already set by debian.sh)

### Locale & Keyboard
d-i debian-installer/locale                     string  en_US.UTF-8
d-i localechooser/supported-locales             multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap          select  us
d-i keyboard-configuration/variant              select  English (US)

### Network — DHCP autoconfiguration
# macOS vmnet NAT is IPv4-only. Kernel ipv6.disable=1 stops wget from preferring
# AAAA records for deb.debian.org, ensuring reliable HTTP mirror verification.
d-i netcfg/choose_interface                     select  auto
d-i netcfg/link_wait_timeout                    string  10
d-i netcfg/get_hostname                         string  debian
d-i netcfg/get_domain                           string  local
d-i netcfg/wireless_wep                         string
d-i hw-detect/load_firmware                     boolean false

# Belt-and-suspenders: installer wget reads this before choose-mirror.
d-i preseed/early_command string echo "nameserver 1.1.1.1" > /etc/resolv.conf; echo "nameserver 8.8.8.8" >> /etc/resolv.conf

### Mirror — Debian 13 (Trixie) over plain HTTP (no HTTPS redirect required)
d-i mirror/protocol                             string  http
d-i mirror/country                              string  manual
d-i mirror/http/hostname                        string  deb.debian.org
d-i mirror/http/directory                       string  /debian
d-i mirror/http/proxy                           string
d-i mirror/suite                                string  trixie
d-i mirror/codename                             string  trixie

### Clock — UTC, no NTP during install
d-i clock-setup/utc                             boolean true
d-i time/zone                                   string  UTC
d-i clock-setup/ntp                             boolean false

### Partitioning — entire /dev/vda, single ext4 root, no swap, no EFI
# Direct kernel boot does not use UEFI; skip an ESP so root stays /dev/vda1.
d-i partman-efi/non_efi_system                  boolean true
d-i partman-partitioning/choose_label           select  gpt
d-i partman-partitioning/default_label          string  gpt
d-i partman-auto/disk                           string  /dev/vda
d-i partman-auto/method                         string  regular
d-i partman-auto/choose_recipe                  select  atomic
d-i partman-auto/expert_recipe                  string  \
        root ::                                         \
                3000 10000 -1 ext4                      \
                        $primary{ } $bootable{ }        \
                        method{ format } format{ }      \
                        use_filesystem{ }               \
                        filesystem{ ext4 }              \
                        mountpoint{ / }                 \
                .
d-i partman/default_filesystem                  string  ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition                    select  finish
d-i partman/confirm                             boolean true
d-i partman/confirm_nooverwrite                 boolean true
d-i partman-basicfilesystems/no_swap            boolean false
d-i partman-basicfilesystems/no_mount_point     boolean false
d-i partman-lvm/confirm                         boolean true
d-i partman-lvm/confirm_nooverwrite             boolean true
d-i partman-md/confirm                          boolean true

### Base system — install arm64 kernel, no recommended packages
d-i base-installer/install-recommends           boolean false
d-i base-installer/kernel/image                 string  linux-image-arm64

### Users — root only, password "root", no normal user
d-i passwd/root-login                           boolean true
d-i passwd/root-password                        password root
d-i passwd/root-password-again                  password root
d-i passwd/make-user                            boolean false

### Package selection — absolute minimum, no tasks, no desktop
tasksel tasksel/first                           multiselect
d-i pkgsel/include                              string  openssh-server
d-i pkgsel/upgrade                              select  none
d-i pkgsel/update-policy                        select  none
popularity-contest popularity-contest/participate boolean false

### Bootloader — GRUB on /dev/vda (not needed for vmm but avoids interactive question)
d-i grub-installer/only_debian                  boolean true
d-i grub-installer/with_other_os                boolean false
d-i grub-installer/bootdev                      string  /dev/vda

### Finish — reboot automatically
d-i finish-install/reboot_in_progress           note
d-i finish-install/keep-consoles                boolean true
